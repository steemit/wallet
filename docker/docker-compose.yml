# ==========================================
# Steem Wallet - Docker Compose Configuration
# ==========================================

services:
  wallet:
    build:
      context: ..
      dockerfile: docker/Dockerfile
      args:
        BUILD_DATE: ${BUILD_DATE:-}
        VCS_REF: ${VCS_REF:-}
        VERSION: ${VERSION:-0.1.0}
    image: steem-wallet:${VERSION:-latest}
    container_name: steem-wallet
    restart: unless-stopped

    ports:
      - "${HOST_PORT:-3000}:8080"

    environment:
      # Application
      - NODE_ENV=production
      - PORT=8080

      # Steem Blockchain
      - STEEM_RPC_URL=${STEEM_RPC_URL:-https://api.steemit.com}
      - STEEM_RPC_FALLBACKS=${STEEM_RPC_FALLBACKS:-}

      # Security — CSRF_SECRET is REQUIRED in production. With no secret all
      # mutations are rejected. Generate one: openssl rand -hex 32
      # SESSION_SECRET is unused (no server-side session) and kept for reference.
      - SESSION_SECRET=${SESSION_SECRET:-}
      - CSRF_SECRET=${CSRF_SECRET:?CSRF_SECRET is required in production}
      - SESSION_MAX_AGE=${SESSION_MAX_AGE:-604800}

      # Analytics
      - MIXPANEL_TOKEN=${MIXPANEL_TOKEN:-}
      - ANALYTICS_ENABLED=${ANALYTICS_ENABLED:-false}
      # Runtime gtag ID (legacy SDC_GOOGLE_ANALYTICS_ID). Empty = script not injected.
      - GOOGLE_ANALYTICS_ID=${GOOGLE_ANALYTICS_ID:-}
      - SDC_GOOGLE_ANALYTICS_ID=${SDC_GOOGLE_ANALYTICS_ID:-}
      - STEEM_WHALE=${STEEM_WHALE:-10000}
      - SBD_WHALE=${SBD_WHALE:-500}

      # Rate Limiting
      - RATE_LIMIT_ENABLED=${RATE_LIMIT_ENABLED:-true}
      - RATE_LIMIT_MAX_QUERY=${RATE_LIMIT_MAX_QUERY:-100}
      - RATE_LIMIT_WINDOW_QUERY=${RATE_LIMIT_WINDOW_QUERY:-60}
      - RATE_LIMIT_MAX_BROADCAST=${RATE_LIMIT_MAX_BROADCAST:-10}
      - RATE_LIMIT_WINDOW_BROADCAST=${RATE_LIMIT_WINDOW_BROADCAST:-60}
      - RATE_LIMIT_MAX_AUTH=${RATE_LIMIT_MAX_AUTH:-10}
      - RATE_LIMIT_WINDOW_AUTH=${RATE_LIMIT_WINDOW_AUTH:-60}

      # Feature Flags
      - MAINTENANCE_MODE=${MAINTENANCE_MODE:-false}
      - FEATURE_WITNESS_VOTING=${FEATURE_WITNESS_VOTING:-true}
      - FEATURE_POWER_DOWN=${FEATURE_POWER_DOWN:-true}
      - FEATURE_DELEGATIONS=${FEATURE_DELEGATIONS:-true}

      # Logging
      - LOG_LEVEL=${LOG_LEVEL:-info}
      - LOG_REQUESTS=${LOG_REQUESTS:-false}

      # OpenTelemetry (optional; off unless WALLET_TELEMETRY_OTLP_ENDPOINT is set)
      - WALLET_TELEMETRY_ENABLED=${WALLET_TELEMETRY_ENABLED:-}
      - WALLET_TELEMETRY_SERVICE_NAME=${WALLET_TELEMETRY_SERVICE_NAME:-wallet}
      - WALLET_TELEMETRY_OTLP_ENDPOINT=${WALLET_TELEMETRY_OTLP_ENDPOINT:-}
      - WALLET_TELEMETRY_OTLP_PATH=${WALLET_TELEMETRY_OTLP_PATH:-}
      - WALLET_TELEMETRY_OTLP_HEADERS=${WALLET_TELEMETRY_OTLP_HEADERS:-}
      - WALLET_TELEMETRY_RESOURCE_ATTRIBUTES=${WALLET_TELEMETRY_RESOURCE_ATTRIBUTES:-}

    # Health check
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://localhost:8080/api/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s

    # Resource limits
    deploy:
      resources:
        limits:
          cpus: '2'
          memory: 2G
        reservations:
          cpus: '0.5'
          memory: 512M

    # Security options
    security_opt:
      - no-new-privileges:true

    # Read-only root filesystem (uncomment if no write access needed)
    # read_only: true

    # Temporary filesystem for /tmp
    tmpfs:
      - /tmp:noexec,nosuid,size=100M

# Named volumes (if needed)
# volumes:
#   data:
#     driver: local
