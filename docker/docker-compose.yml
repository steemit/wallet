# ==========================================
# Steem Wallet - Docker Compose Configuration
#
# The environment section mirrors .env.example exactly: every variable below
# is read by the code (verified by tests/unit/infra-single-source.test.ts).
# Secrets come from the host environment / a local .env file — never literals.
# ==========================================

services:
  wallet:
    build:
      context: ..
      dockerfile: docker/Dockerfile
      args:
        BUILD_DATE: ${BUILD_DATE:-}
        VCS_REF: ${VCS_REF:-}
        VERSION: ${VERSION:-0.1.0}
    image: steem-wallet:${VERSION:-latest}
    container_name: steem-wallet
    restart: unless-stopped

    ports:
      - "${HOST_PORT:-3000}:8080"

    environment:
      # Application (PORT/NODE_ENV are also baked into the image)
      - NODE_ENV=production
      - PORT=8080

      # Steem RPC (comma-separated list = failover chain)
      - STEEM_RPC_URL=${STEEM_RPC_URL:-https://api.steemit.com}

      # Database (MySQL) for account recovery records. Without it the
      # recovery routes return 503 — everything else works.
      - DATABASE_URL=${DATABASE_URL:-}

      # Conveyor credentials for account recovery (kingdom.recovery_account).
      - CONVEYOR_USERNAME=${CONVEYOR_USERNAME:-}
      - CONVEYOR_POSTING_WIF=${CONVEYOR_POSTING_WIF:-}

      # CSRF secret — REQUIRED. With no secret all mutations are rejected.
      # Generate one: openssl rand -hex 32
      - CSRF_SECRET=${CSRF_SECRET:?CSRF_SECRET is required in production}

      # Redis: shared cache, rate limiting, auth challenges. Without it the
      # app degrades to per-process in-memory state (not multi-instance safe).
      - REDIS_URL=${REDIS_URL:-}
      - REDIS_KEY_PREFIX=${REDIS_KEY_PREFIX:-wallet}

      # Rate limiting / proxy trust.
      # TRUST_PROXY_COUNT: trusted reverse-proxy hops; without it all clients
      # share one 'unknown' bucket. Set to 1 behind a single ELB/OpenResty.
      - TRUST_PROXY_COUNT=${TRUST_PROXY_COUNT:-1}
      - RATE_LIMIT_ALLOW_MEMORY_FALLBACK=${RATE_LIMIT_ALLOW_MEMORY_FALLBACK:-}
      # The only tunable per-route limits (login challenges).
      - RATE_LIMIT_AUTH_CHALLENGE_MAX=${RATE_LIMIT_AUTH_CHALLENGE_MAX:-}
      - RATE_LIMIT_AUTH_CHALLENGE_WINDOW=${RATE_LIMIT_AUTH_CHALLENGE_WINDOW:-}

      # Analytics (runtime gtag injection; illegal IDs are ignored)
      - GOOGLE_ANALYTICS_ID=${GOOGLE_ANALYTICS_ID:-}
      - SDC_GOOGLE_ANALYTICS_ID=${SDC_GOOGLE_ANALYTICS_ID:-}
      # Overseer user_action whale thresholds
      - STEEM_WHALE=${STEEM_WHALE:-10000}
      - SBD_WHALE=${SBD_WHALE:-500}

      # OpenTelemetry (optional; off unless an OTLP endpoint is set)
      - WALLET_TELEMETRY_ENABLED=${WALLET_TELEMETRY_ENABLED:-}
      - WALLET_TELEMETRY_SERVICE_NAME=${WALLET_TELEMETRY_SERVICE_NAME:-wallet}
      - WALLET_TELEMETRY_OTLP_ENDPOINT=${WALLET_TELEMETRY_OTLP_ENDPOINT:-}
      - WALLET_TELEMETRY_OTLP_PATH=${WALLET_TELEMETRY_OTLP_PATH:-}
      - WALLET_TELEMETRY_OTLP_HEADERS=${WALLET_TELEMETRY_OTLP_HEADERS:-}
      - WALLET_TELEMETRY_RESOURCE_ATTRIBUTES=${WALLET_TELEMETRY_RESOURCE_ATTRIBUTES:-}
      # Standard OTel kill switch (takes precedence over everything)
      - OTEL_SDK_DISABLED=${OTEL_SDK_DISABLED:-}

    # Health check — LIVENESS (same endpoint as the Dockerfile HEALTHCHECK
    # and the ELB). Never probes the Steem RPC; see docker/Dockerfile.
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://localhost:8080/.well-known/healthcheck.json"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s

    # Resource limits
    deploy:
      resources:
        limits:
          cpus: '2'
          memory: 2G
        reservations:
          cpus: '0.5'
          memory: 512M

    # Security options
    security_opt:
      - no-new-privileges:true

    # Read-only root filesystem (uncomment if no write access needed)
    # read_only: true

    # Temporary filesystem for /tmp
    tmpfs:
      - /tmp:noexec,nosuid,size=100M

# Named volumes (if needed)
# volumes:
#   data:
#     driver: local
